[package]
name = "waash"
version = "0.2.0"
edition = "2021"
description = "What An Amazing SHell - A Linux shell combining FISH interactivity with BASH power"
repository = "https://github.com/xytrolabs/waash"

[dependencies]
# REPL / line editing with autosuggestions, highlighting, completions
rustyline = { version = "15", features = ["derive"] }
rustyline-derive = "0.10"

# POSIX syscall bindings (fork, exec, pipe, signals, etc.)
nix = { version = "0.29", features = ["process", "signal", "fs", "ioctl", "term", "user"] }

# Async runtime for job control
tokio = { version = "1", features = ["full"] }

# Parsing framework
nom = "7"

# Unicode-aware string handling
unicode-width = "0.2"
unicode-segmentation = "1"

# Terminal colors / styling
ansi_term = "0.12"
termcolor = "1"

# Path handling
dirs = "5"

# Glob pattern matching
glob = "0.3"

# Regex for syntax highlighting
regex = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Terminal detection (is stdin a tty?)
atty = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization for config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Vendored rustyline with a small flicker fix (see vendor/rustyline/src/edit.rs
# `external_print`): clears + redraws the prompt atomically instead of in two
# separate flushes, so the live-refresh prompt updates without blanking.
[patch.crates-io]
rustyline = { path = "vendor/rustyline" }
